<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Crypto & FX Live Radar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { margin-bottom: 8px; color: #38bdf8; font-size: 1.8rem; text-align: center; }
    p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }
    
    .btn-sync { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 24px; }
    .btn-sync:hover { background: #0369a1; }
    
    .crypto-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; width: 100%; max-width: 800px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .coin-name { font-size: 1.2rem; font-weight: bold; }
    .price-usd { font-size: 1.5rem; font-weight: 700; color: #4ade80; }
    .price-dkk { font-size: 0.9rem; color: #94a3b8; margin-top: 4px; }
    .status { font-size: 0.8rem; color: #38bdf8; margin-top: 12px; text-align: right; }
  </style>
</head>
<body>

  <h1>Crypto & FX Live Engine 🚀</h1>
  <p class="subtitle">Real-Time Global Market Data for Kunal's Portfolio</p>

  <button class="btn-sync" onclick="fetchLiveCryptoData()">↻ Refresh Live Rates</button>

  <div class="crypto-grid" id="cryptoGrid">
    <p style="color: #94a3b8;">Loading live market prices...</p>
  </div>

  <script>
    // Async/Await function to fetch live crypto rates
    async function fetchLiveCryptoData() {
      const gridContainer = document.getElementById('cryptoGrid');
      
      try {
        // Fetching Bitcoin, Ethereum, Solana prices in USD and DKK (Danish Krone)
        const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd,dkk');
        
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        
        const data = await response.json();
        
        // DOM Manipulation: Clear loading state & inject real data
        gridContainer.innerHTML = '';
        
        const coins = [
          { id: 'bitcoin', name: 'Bitcoin (BTC)' },
          { id: 'ethereum', name: 'Ethereum (ETH)' },
          { id: 'solana', name: 'Solana (SOL)' }
        ];

        coins.forEach(coin => {
          const usdPrice = data[coin.id].usd.toLocaleString();
          const dkkPrice = data[coin.id].dkk.toLocaleString();
          
          const cardHTML = `
            <div class="card">
              <div class="card-header">
                <span class="coin-name">${coin.name}</span>
              </div>
              <div class="price-usd">$${usdPrice} USD</div>
              <div class="price-dkk">${dkkPrice} DKK (Denmark)</div>
              <div class="status">● Live API Synced</div>
            </div>
          `;
          gridContainer.innerHTML += cardHTML;
        });

      } catch (error) {
        gridContainer.innerHTML = `<p style="color: #f87171;">Error loading live data. Please try again.</p>`;
        console.error('Fetch Error:', error);
      }
    }

    // Call function on initial load
    fetchLiveCryptoData();
  </script>

</body>
</html>
